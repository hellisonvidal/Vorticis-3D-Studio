name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Baixar a IA de profundidade (Depth Anything V2 Small, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets/models
          F=app/src/main/assets/models/depth_anything_v2_small_q.onnx
          for URL in \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_int8.onnx \
            https://huggingface.co/Xenova/depth-anything-small-hf/resolve/main/onnx/model_quantized.onnx; do
            if curl -fsSL --retry 3 -o "$F" "$URL"; then echo "Modelo: $URL ($(du -h $F | cut -f1))"; break; fi
            rm -f "$F"
          done
          ls -la app/src/main/assets/models

      - name: Testes da IA, geometria e exportadores
        run: ./gradlew :core:test --no-daemon -i | grep -E "saída=|entradas=|modelo de profundidade|IoU|vídeo|FAILED|Test.*>" || true; ./gradlew :core:test --no-daemon

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Vorticis3DStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vorticis3DStudio-apk
          path: Vorticis3DStudio.apk

      - name: Publicar versão para download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Vorticis 3D Studio 1.1.${{ github.run_number }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            **Instalar:** baixe **Vorticis3DStudio.apk** no celular, abra e permita "instalar apps desconhecidos".
            A partir desta versão, o app avisa sozinho quando houver atualização (menu ⋮ → Verificar atualização).
          files: Vorticis3DStudio.apk
