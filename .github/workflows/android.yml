name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da IA, geometria e exportadores
        run: ./gradlew :core:test --no-daemon

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Vorticis3DStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vorticis3DStudio-apk
          path: Vorticis3DStudio.apk

      - name: Publicar versão para download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vorticis 3D Studio (build ${{ github.run_number }})
          make_latest: true
          body: |
            APK gerado automaticamente a partir de ${{ github.sha }}.
            No celular: baixe **Vorticis3DStudio.apk**, abra e permita "instalar apps desconhecidos".
          files: Vorticis3DStudio.apk
